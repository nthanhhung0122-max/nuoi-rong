name: Auto Kho Bau Rong (Acc 1)

on:
  schedule:
    - cron: '*/25 * * * *'  # Chạy định kỳ mỗi 25 phút
  workflow_dispatch:

jobs:
  farm-khobaurong:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests telethon colorama

      - name: Chay Bot Kho Bau Rong Acc 1
        run: |
          python auto_khobaurong1.py
